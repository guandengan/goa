<script>
var sceneTree = new Scene(
  {
    ".tree": {
      0: { transform: "scale(0)" },
      1.5: { transform: "scale(1)" },
    },
    ".background>.flower": function (i) {
      return {
        0: { opacity: 0, transform: "translateY(0px) rotate(0deg)" },
        1: { opacity: 1 },
        4: { opacity: 1 },
        5: { opacity: 0, transform: "translateY(300px) rotate(360deg)" },
        options: {
          delay: 7 + i,
          iterationCount: "infinite",
        },
      };
    },
  },
  {
    selector: true,
  }
);

var branchs = document.querySelectorAll(
  ".tree .branch, .tree .leaf, .tree .flower1"
);
var depths = [0, 0, 0];

for (var i = 0; i < branchs.length; ++i) {
  var sceneItem = sceneTree.newItem("item" + i);
  var className = branchs[i].className;
  var isFlower = ~className.indexOf("flower1");

  if (~className.indexOf("branch-inner")) {
    ++depths[1];
    depths[2] = 0;
  } else if (~className.indexOf("branch")) {
    ++depths[0];
    depths[1] = 0;
    depths[2] = 0;
  } else if (~className.indexOf("leaf") || isFlower) {
    ++depths[2];
  }
  sceneItem.setElement(branchs[i]);
  sceneItem.setCSS(0, ["transform"]);

  var time = 1 + depths[0] * 0.5 + depths[1] * 0.5 + depths[2] * 0.5;
  var growDuration = isFlower ? 2.5 : 1;
  sceneItem.set(time, "transform", "scale", 0);
  sceneItem.set(time + growDuration, "transform", "scale", 1);
}


const $=s=>document.querySelector(s),svg=$('#scene'),cm=$('#cm'),star=$('#star');
const say=(t,s)=>{$('#title').textContent=t;$('#sub').textContent=s};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const pic='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><rect width="300" height="300" fill="#fff"/><g stroke="#333" stroke-width="3" stroke-linejoin="round">'+
'<rect x="28" y="150" width="20" height="80" fill="#a9743d"/><circle cx="38" cy="120" r="38" fill="#5cb85c"/>'+
'<path d="M120 150l15-30 15 24 15-28 15 28 15-24 15 30z" fill="#38a838"/><ellipse cx="165" cy="225" rx="58" ry="62" fill="#4fc24a"/><circle cx="165" cy="172" r="46" fill="#4fc24a"/>'+
'<ellipse cx="165" cy="245" rx="32" ry="38" fill="#c3f2ae" stroke="none"/><circle cx="148" cy="172" r="5" fill="#222"/><circle cx="184" cy="172" r="5" fill="#222"/>'+
'<path d="M152 190Q166 202 180 190" fill="none" stroke-linecap="round"/><circle cx="136" cy="188" r="7" fill="#ff9db5" stroke="none"/><circle cx="196" cy="188" r="7" fill="#ff9db5" stroke="none"/></g>'+
'<use href="#h" transform="translate(40 30) scale(1.2)" fill="#ff5a7a"/><use href="#h" transform="translate(262 38) scale(1.3)" fill="#4a90e2"/><use href="#h" transform="translate(268 100) scale(1.1)" fill="#ff7ab0"/><use href="#h" transform="translate(255 280) scale(1.1)" fill="#f6921e"/>'+
'<defs><path id="h" d="M0 4C-12-8-14-18-6-18C-2-18 0-14 0-12C0-14 2-18 6-18C14-18 12-8 0 4Z"/></defs></svg>';
const picURL='url("data:image/svg+xml,'+encodeURIComponent(pic)+'")';
let grid=[],tiles=[],busy=false;
function layout(){grid.forEach((v,i)=>{const t=tiles[v];t.style.left=(i%3)*33.333+'%';t.style.top=Math.floor(i/3)*33.333+'%'})}
function initPuzzle(){
  $('#vin').value='';$('#vmsg').textContent='';
  const b=$('#board');b.innerHTML='';grid=[0,1,2,3,4,5,6,7,8];tiles=[];busy=false;
  for(let v=0;v<9;v++){const d=document.createElement('div');d.className='tile';d.style.backgroundImage=picURL;
    d.style.backgroundPosition=(v%3)*50+'% '+Math.floor(v/3)*50+'%';d.onclick=()=>move(grid.indexOf(v));tiles.push(d);b.append(d)}
  tiles[8].style.opacity=0;tiles[8].style.pointerEvents='none';
  let e=8,prev=-1;
  const SHUFFLE=3; // makin kecil = makin gampang (dulu 90)
  for(let k=0;k<SHUFFLE;k++){const r=Math.floor(e/3),c=e%3,n=[];
    if(r>0)n.push(e-3);if(r<2)n.push(e+3);if(c>0)n.push(e-1);if(c<2)n.push(e+1);
    const o=n.filter(x=>x!==prev),p=o[Math.floor(Math.random()*o.length)];
    [grid[e],grid[p]]=[grid[p],grid[e]];prev=e;e=p}
  layout()}
function move(i){
  if(busy)return;const e=grid.indexOf(8);
  if(Math.abs(Math.floor(i/3)-Math.floor(e/3))+Math.abs(i%3-e%3)!==1)return;
  [grid[i],grid[e]]=[grid[e],grid[i]];layout();
  if(grid.every((v,k)=>v===k))win('DDINYATAKAN LULUS S1 PUZZLE')}
function win(msg){busy=true;tiles[8].style.opacity=1;$('#pmsg').textContent=msg;
  setTimeout(()=>{$('#puz').classList.remove('on');startElec()},1500)}
function useVoucher(){
  if(busy)return;const v=$('#vin').value.trim().toUpperCase().replace(/\s+/g,''),m=$('#vmsg');
  if(v==='HIDUPJOKOWI'){m.textContent='';grid=[0,1,2,3,4,5,6,7,8];layout();win('nilai 100')}
  else m.textContent=v?'ulangi par':'ketik HIDUPJOKOWI'}
$('#vgo').onclick=useVoucher;$('#vin').addEventListener('keydown',e=>{if(e.key==='Enter')useVoucher()});
$('#home').onclick=()=>{$('#puz').classList.add('on');initPuzzle()};

const plugEl=$('#plug'),cable=$('#cable'),zap=$('#zap');
const sock={x:721,y:342};let done=false,drag=false;
const anchor={x:-6,y:354},GY=354,SAG=80,feet={x:402,y:352};let cpts=[];
function cableShape(ex,ey){
  cpts=[];const N=80,k=7;
  for(let i=0;i<=N;i++){const t=i/N,x=anchor.x+(ex-anchor.x)*t;
    let y=anchor.y+(ey-anchor.y)*t+SAG*4*t*(1-t);
    y=GY-k*Math.log(1+Math.exp((GY-y)/k));       
    cpts.push([x,y])}
  cpts[N]=[ex,ey];
  cable.setAttribute('d','M'+cpts.map(q=>q[0].toFixed(1)+' '+q[1].toFixed(1)).join('L'))}
function zapAlong(){
  const p=[[sock.x+19,sock.y]];
  for(let i=cpts.length-2;i>0;i-=5){const q=cpts[i];if(q[0]<feet.x+8)break;p.push([q[0],q[1]+(Math.random()-.5)*24])}
  p.push([feet.x,feet.y]);
  return p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}
const jag=(x1,y1,x2,y2,n=7)=>{let p=[];for(let i=0;i<=n;i++){const t=i/n,j=(i==0||i==n)?0:(Math.random()-.5)*26;p.push((x1+(x2-x1)*t+j*.3).toFixed(1)+','+(y1+(y2-y1)*t+j).toFixed(1))}return p.join(' ')};
function setPlug(x,y){
  plugEl.setAttribute('transform',`translate(${x},${y})`);
  cableShape(x-14,y);
  const d=Math.hypot(sock.x-x,sock.y-y);
  if(d<130&&!done){zap.style.display='block';zap.setAttribute('points',jag(x+19,y,sock.x+19,sock.y))}else if(!done)zap.style.display='none'}
const pt=e=>new DOMPoint(e.clientX,e.clientY).matrixTransform(svg.getScreenCTM().inverse());
function startElec(){
  svg.classList.add('elec');$('#home').style.display='none';
  say('NEW ITEM UNLOCKEDD','Coba seret colokan nya par ke arah stop kontak');setPlug(450,352);
  setInterval(()=>{if(!done&&zap.style.display==='block'){const p=plugEl.transform.baseVal[0].matrix;zap.setAttribute('points',jag(p.e+19,p.f,sock.x+19,sock.y))}},90)}
plugEl.addEventListener('pointerdown',e=>{if(done)return;drag=true;plugEl.setPointerCapture(e.pointerId);e.preventDefault()});
plugEl.addEventListener('pointerup',()=>drag=false);
plugEl.addEventListener('pointermove',e=>{
  if(!drag||done)return;let p=pt(e),x=clamp(p.x,60,790),y=clamp(p.y,230,358);
  const d=Math.hypot(sock.x-x,sock.y-y);if(d<85){x+=(sock.x-x)*.45;y+=(sock.y-y)*.45}
  setPlug(x,y);if(Math.hypot(sock.x-x,sock.y-y)<24)connect()});
function connect(){
  done=true;drag=false;setPlug(sock.x,sock.y);cable.classList.add('hot');
  cm.classList.remove('conf');cm.classList.add('shock');$('#cmJ').classList.add('hop');say('ZZZZT BBBEERR BBER PATAPIM','');
  const iv=setInterval(()=>{zap.style.display='block';zap.setAttribute('points',zapAlong())},70);
  setTimeout(()=>{clearInterval(iv);zap.style.display='none';cable.classList.remove('hot');cm.classList.remove('shock');$('#cmJ').classList.remove('hop');cm.classList.add('conf');spawnStar()},2300)}

let starOn=false,tired=false,dodges=0,lock=0,sx=0,sy=0;const NEED=2;
const msgs=['Coba pencet bintang nya par','KEJAR PAR','Dikit lagi','Dikit lagi','dikit lagi!','Satu kali tap'];
function place(x,y){sx=x;sy=y;star.style.left=x+'px';star.style.top=y+'px'}
function spawnStar(){const r=$('#cmHead').getBoundingClientRect();star.style.display='block';place(r.left+r.width/2,r.top-34);starOn=true;cm.classList.remove('conf');cm.classList.add('dizzy');say(msgs[0],'Kejar bintang nya par')}
function dodge(){
  const now=Date.now();if(now<lock||tired)return;lock=now+700;
  const W=innerWidth,H=innerHeight;let x,y,t=0;
  do{x=50+Math.random()*(W-100);y=80+Math.random()*(H*.55);t++}while(Math.hypot(x-sx,y-sy)<170&&t<25);
  place(x,y);dodges++;
  if(dodges>=NEED){tired=true;star.classList.add('tired');say('Efek usia jadi loyo','pencet dia par')}else say(msgs[dodges],'')}
const near=e=>starOn&&!tired&&Math.hypot(e.clientX-sx,e.clientY-sy)<55&&dodge();
document.addEventListener('pointermove',near);document.addEventListener('pointerdown',near);
star.addEventListener('pointerdown',e=>{e.preventDefault();e.stopPropagation();if(tired)catchStar()});

const COLORS=['#ff7eb3','#ef4b4b','#ffa63d','#ffd93b','#4cb8e8','#a56be0'];
let pick=COLORS[0],blooms=[],painted=new Set(),gameOn=false,treeS=1;
function fitTree(){treeS=clamp(Math.min((innerHeight-110)/445,innerWidth/370),.6,1.2);
  $('#final .background').style.setProperty('--ts',treeS.toFixed(3))}
addEventListener('resize',fitTree);
function buildPalette(){const p=$('#pal');p.innerHTML='';
  COLORS.forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label','Warna '+(i+1));
    if(c===pick)b.className='sel';
    b.onclick=()=>{pick=c;p.querySelectorAll('button').forEach(x=>x.classList.toggle('sel',x===b))};p.append(b)})}
function prepFlowers(){
  blooms=[...document.querySelectorAll('#final .tree .flower1')];painted.clear();gameOn=false;
  blooms.forEach(f=>{f.classList.add('paint');f.style.removeProperty('--fc')})}
function upd(){const s=$('#gscore');s.classList.add('on');const n=painted.size,N=blooms.length;
  s.innerHTML=n<N?'🌸 '+n+' / '+N+' &nbsp; Kelas mewarnai bareng pedut!<small>pilih warna trus tap bunga nya di pohon</small>'
    :'Rating 100 dari mahaguru <button id="again">Maen lagi</button>';
  const a=$('#again');if(a)a.onclick=resetPaint}
function startPaint(){buildPalette();$('#pal').classList.add('on');gameOn=true;upd()}
function resetPaint(){blooms.forEach(f=>f.style.removeProperty('--fc'));painted.clear();upd()}
function spark(x,y,c,n=6){for(let i=0;i<n;i++){const s=document.createElement('i');s.className='sp';
  s.style.left=x+'px';s.style.top=y+'px';s.style.background=c;
  s.style.setProperty('--dx',(Math.random()*64-32)+'px');s.style.setProperty('--dy',(-14-Math.random()*44)+'px');
  $('#final').append(s);setTimeout(()=>s.remove(),750)}}
const center=f=>{const r=f.getBoundingClientRect();return[r.left+r.width/2,r.top+r.height/2,r.width]};
function paintFlower(f){
  f.style.setProperty('--fc',pick);const[x,y]=center(f);spark(x,y,pick);
  if(!painted.has(f)){painted.add(f);upd();
    if(painted.size===blooms.length)blooms.forEach((b,i)=>setTimeout(()=>{const[bx,by]=center(b);spark(bx,by,COLORS[i%COLORS.length],8)},i*60))}}
document.addEventListener('pointerdown',e=>{
  if(!gameOn||e.target.closest('button'))return;
  let best=null,bd=1e9;
  for(const f of blooms){const[x,y,w]=center(f);if(w<6)continue;const d=Math.hypot(e.clientX-x,e.clientY-y);if(d<bd){bd=d;best=f}}
  if(best&&bd<Math.max(26,28*treeS))paintFlower(best)});

function catchStar(){
  starOn=false;star.style.pointerEvents='none';cm.classList.remove('dizzy');star.classList.remove('tired');star.classList.add('seed');say('Bintang berubah jadi gogreen','');
  prepFlowers();fitTree();
  $('#final').classList.add('on');
  setTimeout(()=>{star.style.transition='left .8s ease-in-out,top .9s cubic-bezier(.5,0,1,.7)';place(innerWidth/2,innerHeight-95*treeS-7)},350);
  setTimeout(()=>{$('#final').classList.add('grow');sceneTree.playCSS();star.style.transition='opacity .8s,transform .8s';star.style.opacity=0;star.style.transform='scale(.3)'},1500);
  setTimeout(startPaint,10500);
  setTimeout(()=>{const m=$('#fMam');m.classList.add('go');$('#fMamUse').style.setProperty('--ps','running');setTimeout(()=>$('#fMamUse').style.setProperty('--ps','paused'),7000)},5200)}

const mamA=$('#mamA'),mamB=$('#mamB');
const M={AX:110,AY:142,GROUND:359,DOOR:626,X0:-130,TURN:480,SPEED:50,TT:3.2,TD:3.6,TW:2.5};
M.TWALK=(M.TURN-M.X0)/M.SPEED;M.TALL=M.TWALK+M.TT+M.TD+M.TW;
const sm=k=>k*k*(3-2*k);
function mamPose(t){
  t%=M.TALL;
  if(t<M.TWALK){const px=M.X0+M.SPEED*t;return{px,py:M.GROUND,s:1,op:1,front:px>405}}
  t-=M.TWALK;
  if(t<M.TT){const k=sm(t/M.TT);return{px:M.TURN+(M.DOOR-M.TURN)*k,py:M.GROUND-19*k,s:1-.4*k,op:1,front:true}}
  t-=M.TT;
  if(t<M.TD){const k=t/M.TD,e=sm(k);return{px:M.DOOR,py:340-48*e,s:.6-.32*e,op:k<.7?1:1-(k-.7)/.3,front:false}}
  return{px:M.DOOR,py:292,s:.28,op:0,front:false}}
function mamFrame(now){
  requestAnimationFrame(mamFrame);
  if($('#final').classList.contains('on'))return;
  const p=mamPose(now/1000),tr='translate('+(p.px-M.AX*p.s).toFixed(1)+','+(p.py-M.AY*p.s).toFixed(1)+') scale('+p.s.toFixed(3)+')';
  mamA.setAttribute('transform',tr);mamB.setAttribute('transform',tr);
  mamA.style.visibility=p.front?'hidden':'visible';mamB.style.visibility=p.front?'visible':'hidden';
  mamA.style.opacity=mamB.style.opacity=p.op}
requestAnimationFrame(mamFrame);
</script>
